<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0c" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Rahul Kumar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/portfolio.css" />
    <style>
      .not-found{min-height:100svh;width:min(calc(100% - 3rem),1440px);margin:auto;padding:8rem 0 3rem;display:grid;grid-template-columns:.45fr 1.55fr;gap:3rem;align-items:center}.not-found-code{color:#b9ff66;font:500 .72rem/1.5 "DM Mono",monospace;letter-spacing:.08em}.not-found h1{font-size:clamp(5rem,16vw,15rem)}.not-found h1 span{font-family:Georgia,serif;font-style:italic;font-weight:400}.not-found p{max-width:620px;color:#c8c7bf;font-size:1.1rem;line-height:1.7}.not-found .button{margin-top:1rem}@media(max-width:760px){.not-found{width:calc(100% - 2rem);grid-template-columns:1fr;align-content:center}.not-found h1{font-size:clamp(4.5rem,24vw,8rem)}}
    </style>
  </head>
  <body>
    <main class="not-found">
      <p class="not-found-code">ERROR / 404<br />ROUTE_NOT_FOUND</p>
      <div>
        <h1>Lost in the <span>system.</span></h1>
        <p>The route you requested does not exist—or it moved during the migration. The main portfolio is healthy.</p>
        <a class="button button-primary" href="index.html">Return to portfolio <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
